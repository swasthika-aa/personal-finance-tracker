[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-tracker"
version = "0.1.0"
description = "Notebook-first local personal finance analytics"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3,<3",
  "pandas>=2.3.3,<4",
  "scikit-learn>=1.8,<2",
  "matplotlib>=3.10.7,<4",
  "seaborn>=0.13.2,<0.14",
  "jupyterlab>=4.4,<5",
  "ipywidgets>=8.1,<9",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "ipykernel>=6.30,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[project.scripts]
finance-demo = "finance_tracker.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["future-cloud-scope", ".*", "venv", "data", "outputs", "build", "dist", "*.egg-info"]