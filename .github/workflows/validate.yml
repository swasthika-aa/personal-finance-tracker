name: Validate finance demo

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt -e ".[dev,gcp]"
      - run: python -m pip check
      - run: python -m pytest -q -W error
      - run: python scripts/execute_notebook.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-reports-${{ matrix.os }}
          path: outputs/
          retention-days: 7
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finance-demo:ci .