name: Validate local finance demo

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q -W error
      - run: python scripts/execute_notebook.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-reports-${{ matrix.os }}
          path: outputs/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host-owned demo directories
        run: mkdir -p data outputs
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Execute local batch and clean-kernel notebook
        run: |
          export LOCAL_UID=$(id -u)
          export LOCAL_GID=$(id -g)
          docker compose run --rm batch
          docker compose run --rm batch python scripts/execute_notebook.py
      - name: Verify notebook server
        run: |
          export LOCAL_UID=$(id -u)
          export LOCAL_GID=$(id -g)
          docker compose up -d --wait notebook
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down